name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore "src/Lunar Engine.sln"
      - name: Build
        run: dotnet build "src/Lunar Engine.sln" -c Release --no-restore --nologo
      - name: Unit tests
        run: >
          dotnet test "src/Lunar Engine.sln" -c Release --no-build --nologo
          --filter "Category!=E2E"
          --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: artifacts/test-results

  e2e:
    name: End-to-end (Docker host)
    needs: unit
    # A self-hosted runner installed on the Docker server, registered with these labels.
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose build e2e
      - name: Run unit + end-to-end suite in container
        run: docker compose run --rm e2e all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: artifacts/e2e
